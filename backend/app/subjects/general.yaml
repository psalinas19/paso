slug: general
name: General
notation: ""

# For notebooks created with the generic template: no subject-specific notation,
# every verification strategy that needs no special setup.
complex_domain: false
independent_vars: [x, t]
extra_functions: [LaplaceTransform, InverseLaplaceTransform, Heaviside, DiracDelta]

strategies:
  - expression
  - equation
  - system
  - ode
  - numeric_iteration
  - laplace

tolerance:
  absolute: 1.0e-9
  relative: 1.0e-6
  hand_rounding: 5.0e-3

topics: []

error_types:
  - id: sign
    label: Error de signo
    description: Signo perdido o cambiado al pasar un término o al operar.
  - id: algebra
    label: Error algebraico
    description: Factorización, distribución, exponentes o fracciones mal operados.
  - id: arithmetic
    label: Error aritmético
    description: Una cuenta numérica mal hecha.
  - id: concept
    label: Error de concepto
    description: Se aplicó un método o una regla que no corresponde.
  - id: transcription
    label: Error al copiar
    description: Un término cambió al pasar de un renglón al siguiente.

notation_notes: |
  Transformada de Laplace. En esta materia también puedes usar estas funciones en `sympy`:
  - `LaplaceTransform(f, t, s)` para L{f(t)}, sin evaluar. Ejemplo: L{e^{-2t}} es `LaplaceTransform(exp(-2*t), t, s)`.
  - `InverseLaplaceTransform(F, s, t)` para L^{-1}{F(s)}, sin evaluar. Ejemplo: L^{-1}{3/(s^2+9)} es `InverseLaplaceTransform(3/(s**2 + 9), s, t)`.
  - `Heaviside(t - a)` para el escalón unitario u(t - a) y `DiracDelta(t - a)` para el impulso.
  La variable del tiempo es siempre `t` y la de Laplace siempre `s`. Las funciones en s se escriben aplicadas: `F(s)`, `Y(s)`; las del tiempo, `f(t)`, `y(t)`.
  Un renglón como "L^{-1}{F(s)} = f(t)" es una ecuación: `Eq(InverseLaplaceTransform(...), ...)`.
